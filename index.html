<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Shadow Generator — Glassmorphism Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-emoji">👥</span>
                <div class="title-col">
                    <h1>CSS Box Shadow Generator</h1>
                    <p class="tagline">Design gorgeous CSS drop shadows and copy styling values.</p>
                </div>
            </div>
            <div class="badge">css</div>
        </header>

        <main class="workspace-card">
            
            <div style="display:flex; justify-content:center; padding: 30px 0;">
                <div id="shadow-box" style="width:100px; height:100px; background:#12121a; border:1px solid var(--border); border-radius:12px;"></div>
            </div>
            <input type="range" id="sh-blur" min="0" max="100" value="20" style="width:100%; margin-top:12px;">
            <textarea id="sh-code" readonly style="width:100%; height:80px; margin-top:12px; font-family:monospace;"></textarea>
        
        </main>
        
        <footer class="app-footer">
            <p>Created as a premium portfolio piece by <a href="https://github.com/VARSHAN69" target="_blank">@VARSHAN69</a></p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
